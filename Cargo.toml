[package]
name = "autark"
version = "2026.11.2"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
rfd = "0.15"
url = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "autark"
path = "src/main.rs"
